add_expense:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: chargelogger
    car_id:
      required: true
      example: "65f0c0ffee0123456789abcd"
      selector:
        text:
    category:
      required: true
      selector:
        select:
          translation_key: category
          options:
            - insurance
            - tax
            - tires
            - tolls_parking
            - cleaning
            - maintenance
            - accessories
            - subscriptions
            - other
    amount:
      required: true
      example: 12.5
      selector:
        number:
          min: 0.01
          max: 1000000
          step: 0.01
          mode: box
    kind:
      required: false
      default: expense
      selector:
        select:
          translation_key: kind
          options:
            - expense
            - income
    note:
      required: false
      selector:
        text:
    date:
      required: false
      selector:
        datetime:

add_charge:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: chargelogger
    car_id:
      required: true
      example: "65f0c0ffee0123456789abcd"
      selector:
        text:
    cpo:
      required: true
      example: "Home Wallbox"
      selector:
        text:
    kwh:
      required: true
      example: 32.5
      selector:
        number:
          min: 0.01
          max: 1000
          step: 0.01
          unit_of_measurement: kWh
          mode: box
    charge_type:
      required: false
      default: AC
      selector:
        select:
          options:
            - AC
            - DC
    odometer:
      required: false
      example: 48250
      selector:
        number:
          min: 0
          max: 10000000
          unit_of_measurement: km
          mode: box
    km_driven:
      required: false
      example: 210
      selector:
        number:
          min: 0
          max: 100000
          unit_of_measurement: km
          mode: box
    price_total:
      required: false
      example: 10.4
      selector:
        number:
          min: 0
          max: 100000
          step: 0.01
          mode: box
    soc_after:
      required: false
      example: 80
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    note:
      required: false
      selector:
        text:
    date:
      required: false
      selector:
        datetime:
