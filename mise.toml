[env]
_.python.venv = { path = ".venv" }

[tools]
python = "3.14"

[tasks.test]
description = "Run tests with coverage"
run = "pytest --cov=custom_components --cov-report=term-missing -v"

[tasks.format]
description = "Format and fix linting"
run = "ruff format . && ruff check --fix ."

[tasks.lint]
description = "Check linting only"
run = "ruff check ."
