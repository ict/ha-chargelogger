[project]
name = "ha-chargelogger"
version = "0.1.0"
description = "Home Assistant integration for the self-hosted Chargelogger EV charging and expense tracker"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component==0.13.371",
    "pytest-cov>=5",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
