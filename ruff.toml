target-version = 'py314'
line-length = 120

[lint.flake8-quotes]
inline-quotes = "single"

[lint]
preview = true
explicit-preview-rules = true
select = ["ALL", "RUF027"]  # Warn on potential f-string without 'f'
ignore = [
    "CPY",  # no copyright headers
    "ARG",  # Home Assistant callback signatures are fixed
    "ANN401", "PLR0913",  # Any in JSON payloads; keyword-only service helpers
    "ANN001", "ANN2", # Missing Annotations for return type
    "D2",  # Docstring stuff
    "D4",  # Don't tell me how to write my docstrings
    "COM812", "ISC001", # Disabled because formatter complains about potential side effects
    "PERF203",  # Try-Except within loop
    "PLR2004",  # Magic numbers in comparison
    "TD", "FIX", # TODO and FIXME
    "T201",  # print
    "TRY003", "TRY400",  # Exception stuff
    "Q", # Quotes are adapted with the formatter
    "S101", # Use of assert
]
extend-safe-fixes = ["ALL"]

[format]
quote-style = "single"
docstring-code-format = true

[lint.per-file-ignores]
"tests/**" = ["D", "ARG", "ANN", "PLR0913", "PLR0917", "S105", "S106", "PLC0415", "SLF001", "PT011", "E501", "INP001", "TC", "PLR6301", "DOC", "FBT"]
